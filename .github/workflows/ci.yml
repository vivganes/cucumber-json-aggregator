name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py3.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs needs tags
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.10
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
