[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cucumber-json-aggregator"
dynamic = ["version"]
description = "Aggregate multiple Cucumber JSON reports (Cucumber-JVM, cucumber-js) into a single report."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["typer>=0.12"]
keywords = ["cucumber", "bdd", "json", "report", "aggregate", "merge"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.scripts]
cucumber-json-aggregator = "cucumber_json_aggregator.cli:app"
cja = "cucumber_json_aggregator.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/cucumber_json_aggregator/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cucumber_json_aggregator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/cucumber_json_aggregator/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP007", "UP045"]

[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = ["_version\\.py$"]
